name: TP4-04 - Evidencia de bloqueo
run-name: TP4-04 - ${{ inputs.fail_test && 'fallo controlado' || 'control verde' }}

on:
  workflow_dispatch:
    inputs:
      fail_test:
        description: Hacer fallar la prueba de evidencia
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  run-tests:
    name: Quality Gate - dotnet test
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Password123! -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test_Password123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution dependencies
        run: dotnet restore Dsw2025Tpi.sln

      - name: Build solution
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Run automated tests
        env:
          TP4_QA_FORCE_FAILURE: ${{ inputs.fail_test && 'true' || 'false' }}
          QA_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=Test_Password123!;TrustServerCertificate=True;"
        run: dotnet test Dsw2025Tpi.sln --configuration Release --no-build --verbosity normal
  build-and-deploy:
    name: Deploy simulado (sin publicacion)
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/tp4-04-evidencia-quality-gate'
    steps:
      - name: Confirmar que el Quality Gate habilita el deploy
        run: echo "Deploy simulado. No se publico ninguna imagen ni se contacto a Azure."
