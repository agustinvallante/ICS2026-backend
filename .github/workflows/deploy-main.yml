
name: Build and Deploy to Azure App Service

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ics-backend

jobs:
  run-tests:
    name: Quality Gate - dotnet test
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Password123! -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test_Password123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution dependencies
        run: dotnet restore Dsw2025Tpi.sln

      - name: Build solution
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Run automated tests
        env:
          QA_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=Test_Password123!;TrustServerCertificate=True;"
        run: dotnet test Dsw2025Tpi.sln --configuration Release --no-build --verbosity normal
  docker-build-check:
    name: Validate Docker Build (No Push)
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (validation only)
        run: docker build -t "$IMAGE_NAME:ci" -f Dockerfile .

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # 1. Obtener el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 5. Construir la imagen Docker
      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:ci" -f Dockerfile .

      # 6. Iniciar sesión en Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Publicar la imagen
      - name: Push Docker image
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "$IMAGE_NAME:ci" "$HUB_USER/$IMAGE_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:ci" "$HUB_USER/$IMAGE_NAME:latest"

          docker push "$HUB_USER/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$HUB_USER/$IMAGE_NAME:latest"

      # 8. Desplegar en Azure
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
